{% extends 'layouts/auth.html' %}

{% block title %}
Atlas ERP | Login
{% endblock %}

{% block content %}
{% if messages %}

    {% for message in messages %}

        <div class="alert alert-danger">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}

<div class="login-box">

    <div class="login-logo">

        <b>Atlas</b> ERP

    </div>

    <div class="card">

        <div class="card-body login-card-body">

            <p class="login-box-msg">

                Iniciar sesión

            </p>

            <form method="POST">

    {% csrf_token %}

    <div class="input-group mb-3">

        <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Usuario">

        <div class="input-group-text">
            <span class="bi bi-person-fill"></span>
        </div>

    </div>

    <div class="input-group mb-3">

        <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Contraseña">

        <div class="input-group-text">
            <span class="bi bi-lock-fill"></span>
        </div>

    </div>

    <button class="btn btn-primary w-100">
        Iniciar Sesión
    </button>

</form>

        </div>

    </div>

</div>

{% endblock %}
